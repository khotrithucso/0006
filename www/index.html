<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sổ Tay 0006 Pro V1</title>
  
  <!-- CKEditor 4 Full CDN -->
  <script src="https://cdn.ckeditor.com/4.22.1/full/ckeditor.js"></script>
  
  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Dexie.js (IndexedDB Wrapper) -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar Drawer Backdrop -->
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- Sidebar Left: Danh Sách Cuốn Tập -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2>📚 Tủ Sổ Tay</h2>
      <button class="btn-icon" onclick="closeSidebar()">✕</button>
    </div>
    
    <div class="sidebar-actions">
      <button class="btn-create" onclick="createNewNotebook()">+ Cuốn tập mới</button>
      <input type="text" id="search-input" placeholder="🔍 Tìm kiếm bài viết..." oninput="onSearchInput(this.value)">
    </div>

    <ul id="notebook-list"></ul>

    <div class="sidebar-footer">
      <button onclick="exportDataJSON()" class="btn-secondary">📥 Export JSON</button>
      <button onclick="triggerImport()" class="btn-secondary">📤 Import JSON</button>
      <input type="file" id="import-file-input" accept=".json" style="display: none;" onchange="importDataJSON(event)">
    </div>
  </aside>

  <!-- Main Viewport -->
  <main id="main-content">
    <!-- Top Action Bar -->
    <header class="top-bar">
      <button class="btn-menu" onclick="openSidebar()">☰</button>
      <input type="text" id="note-title" placeholder="Tiêu đề tập ghi chép..." onchange="saveCurrentNoteAuto()">
      
      <div class="action-buttons">
        <button onclick="openCanvasModal()" title="Vẽ tay">🎨 Vẽ</button>
        <button onclick="insertMathFormulaPrompt()" title="Chèn công thức toán">∑ Toán</button>
        <button onclick="saveCurrentNoteAuto()" class="btn-save">💾 Lưu</button>
      </div>
    </header>

    <!-- Editor Wrapper -->
    <div class="editor-wrapper">
      <textarea id="editor" name="editor"></textarea>
    </div>
  </main>

  <!-- Modal Vẽ Tay (Canvas Drawing Board) -->
  <div id="canvas-modal" class="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>🎨 Bảng Vẽ Ghi Chú Tay</h3>
        <button class="btn-icon" onclick="closeCanvasModal()">✕</button>
      </div>
      
      <div class="canvas-toolbar">
        <label>Màu: <input type="color" id="brush-color" value="#000000"></label>
        <label>Nét: 
          <input type="range" id="brush-size" min="1" max="20" value="3">
          <span id="brush-size-val">3px</span>
        </label>
        <button onclick="setEraserMode()" id="btn-eraser">🧹 Tẩy</button>
        <button onclick="setPenMode()" id="btn-pen" class="active">✏️ Bút</button>
        <button onclick="clearCanvas()">🗑️ Xóa hết</button>
      </div>

      <div class="canvas-container">
        <canvas id="drawing-board" width="600" height="400"></canvas>
      </div>

      <div class="modal-footer">
        <button onclick="closeCanvasModal()" class="btn-secondary">Hủy</button>
        <button onclick="insertDrawingToEditor()" class="btn-save">Chèn vào ghi chép</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
