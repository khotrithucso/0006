name: Gemini AI Coding Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-agent:
    if: >
      github.actor == github.repository_owner &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body || '', '@gemini-cli')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body || '', '@gemini-cli'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Run Gemini CLI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -o pipefail
          RAW_PROMPT="${COMMENT_BODY:-$ISSUE_BODY}"
          CLEAN_PROMPT="${RAW_PROMPT//@gemini-cli/}"
          FULL_PROMPT="Bạn là AI coding agent đang làm việc trực tiếp trong thư mục dự án trên GitHub Actions. Hãy đọc các file mã nguồn chính và chỉnh sửa trực tiếp trên ổ đĩa để hoàn thành yêu cầu sau (không sửa thư mục .github/workflows, android hoặc node_modules trừ khi được yêu cầu rõ): $CLEAN_PROMPT"

          SUCCESS=false
          for i in 1 2 3; do
            echo "=== Lần thử $i ==="
            if [ "$i" -eq 2 ]; then
              echo "Chuyển sang model gemini-2.5-flash để tránh quá tải..."
              npx -y @google/gemini-cli -y -m gemini-2.5-flash -p="$FULL_PROMPT" 2>&1 | tee /tmp/gemini_output.txt && SUCCESS=true && break
            else
              npx -y @google/gemini-cli -y -p="$FULL_PROMPT" 2>&1 | tee /tmp/gemini_output.txt && SUCCESS=true && break
            fi
            echo "Server Gemini đang quá tải (503), đợi 20 giây rồi thử lại..."
            sleep 20
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "Đã thử 3 lần nhưng API Gemini vẫn quá tải."
            exit 1
          fi

      - name: Commit and Push changes
        id: git_push
        run: |
          git config user.name "gemini-cli[bot]"
          git config user.email "gemini-cli[bot]@users.noreply.github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AI update via Gemini CLI"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply to Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.git_push.outputs.changed }}
          COMMIT_SHA: ${{ steps.git_push.outputs.sha }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            HEADER="❌ **Gemini CLI gặp lỗi trong quá trình chạy.**"
          elif [ "$CHANGED" = "true" ]; then
            HEADER="✅ **Đã cập nhật code lên nhánh \`main\`** (Commit: \`$COMMIT_SHA\`)"
          else
            HEADER="ℹ️ **Hoàn tất kiểm tra** (Không có file nào bị thay đổi)."
          fi

          SUMMARY=$(tail -n 60 /tmp/gemini_output.txt 2>/dev/null || echo "Không có nội dung log.")
          {
            echo "$HEADER"
            echo ""
            echo "<details><summary>Xem chi tiết phản hồi từ Gemini</summary>"
            echo ""
            echo '```text'
            echo "$SUMMARY"
            echo '```'
            echo "</details>"
          } > /tmp/reply.md

          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/reply.md
