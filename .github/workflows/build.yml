name: Build Android APK (App 0006 Pro V2 - Fix Crash)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Cài đặt Capacitor & AdMob Plugin
      - name: Install Dependencies & Plugins
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      # 2. Chuẩn bị thư mục www & Tạo Android Project
      - name: Prepare Web Assets & Add Android Platform
        run: |
          mkdir -p www
          npx cap add android || true

      # 3. Chèn AdMob Application ID & Network Security vào AndroidManifest.xml (Sửa lỗi văng App)
      - name: Inject AdMob App ID & Network Config into AndroidManifest
        run: |
          mkdir -p android/app/src/main/res/xml
          cat << 'EOF' > android/app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                      <certificates src="user" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              admob_meta = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/>'
              if 'APPLICATION_ID' not in content:
                  content = content.replace('</application>', f'    {admob_meta}\n    </application>')
              if 'networkSecurityConfig' not in content:
                  content = content.replace('<application ', '<application android:networkSecurityConfig=\"@xml/network_security_config\" android:usesCleartextTraffic=\"true\" ')
              with open(manifest_path, 'w') as f:
                  f.write(content)
              print('✅ Injected AdMob App ID into AndroidManifest.xml')
          "

      # 4. Đồng bộ Web Assets vào Native Android
      - name: Sync Capacitor Assets
        run: |
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 5. Khắc phục lỗi trùng lặp Kotlin (nếu có)
      - name: Fix Kotlin Duplicate Dependencies
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "
            configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            " >> android/app/build.gradle
          fi

      # 6. Build Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 7. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-0006-smartnote-prov2-fixed
          path: android/app/build/outputs/apk/debug/app-debug.apk
