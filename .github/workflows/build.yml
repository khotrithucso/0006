name: Build Android APK (App 0006 Pro V1)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Khởi tạo & Cài đặt Capacitor
      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

      # 2. Tạo & Đồng bộ Android Project
      - name: Add & Sync Capacitor Android Project
        run: |
          npx cap add android || true
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/

      # 3. Sửa lỗi trùng lặp thư viện Kotlin (nếu có)
      - name: Fix Kotlin Duplicate Dependencies
        run: |
          if ! grep -q "kotlin-stdlib-jdk7" android/app/build.gradle; then
            echo "
            configurations.all {
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            " >> android/app/build.gradle
          fi

      # 4. Build APK Debug
      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 5. Upload File APK (Sử dụng action/upload-artifact@v4)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-0006-notebook-pro-v1-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
